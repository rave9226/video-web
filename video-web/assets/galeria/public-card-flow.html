      Array.from($("title").getElementsByClassName("f07-firma-word")).forEach((word, i) => {

      // discrete-text-sequence: keystroke clusters, short holds at "." and "/", bulk "…" at 2.28
      const SEQUENCE = [
        [0, ""],
        [1.0, "b"],
        [1.05, "bio"],
        [1.11, "bionic"],
        [1.17, "acmesal"],
        [1.24, "acmesalud"],

        [1.95, "acmesalud.com/terminos"],
        [2.08, "acmesalud.com/terminos/"],
        [2.28, "acmesalud.com/terminos/…"],
      ];
      const textAt = (t) => {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (t >= SEQUENCE[i][0]) return SEQUENCE[i][1];

      tl.fromTo($("boxfill"), { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.18, ease: "power3.out" }, 4.0);
      tl.fromTo($("tick"), { strokeDashoffset: 102 }, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 4.05);

      // press-release-spring: linear dip, back.out release, burst behind the button
      const press = (btn, burst, at) => {
        tl.to(btn, { scale: 0.93, duration: 0.12, ease: "power1.in" }, at);
        tl.to(btn, { scale: 1, duration: 0.42, ease: "back.out(1.8)" }, at + 0.12);
        tl.fromTo(burst, { opacity: 0, scaleX: 1, scaleY: 1 }, { opacity: 0.55, scaleX: 1.12, scaleY: 2.2, duration: 0.3, ease: "power2.out" }, at + 0.12);
        tl.to(burst, { opacity: 0, duration: 0.35, ease: "power2.in" }, at + 0.42);
