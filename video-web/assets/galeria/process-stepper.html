  <script>
    const el = (id) => document.getElementById("f10-renovaciones-" + id);
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0–1.9): "30" counts 0→30 while scaling 0.5→1 (counting-dynamic-scale); label on "del" (0.9).
    // Direct innerText tween (recipe variation): no onUpdate, so it renders even on event-suppressed seeks.
    const count = el("count");
    tl.fromTo(
      count,
      { innerText: 0, scale: 0.5 },
      { innerText: 30, snap: { innerText: 1 }, scale: 1, duration: 1.2, ease: "power3.out" },
      0,
    );
    tl.fromTo(el("label"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.9);

    // Scene 2 (1.9–4.4): window slides in from the right (2.0), slow push underneath; turquoise ring (2.3).
    const win = el("window");
    tl.fromTo(win, { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.0);
    tl.fromTo(win, { scale: 1 }, { scale: 1.02, duration: 7.19, ease: "none" }, 2.0);
    tl.fromTo(
      el("ring-cta"),
      { opacity: 0, scale: 1.12 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
      2.3,
    );

    // svg-path-draw: dash = measured length; offset starts one unit past the start so no round-cap dot shows.
    const draw = (path, at, duration) => {
      const len = path.getTotalLength();
      path.style.strokeDasharray = `${len} ${len + 2}`;
      tl.fromTo(path, { strokeDashoffset: len + 1 }, { strokeDashoffset: 0, duration, ease: "none" }, at);
    };
    const light = (n, at, fromScale = 0.6, ease = "back.out(1.8)") =>
      tl.fromTo(
        el(`chip-${n}`),
        { opacity: 0, scale: fromScale },
        { opacity: 1, scale: 1, duration: 0.45, ease },
        at,
      );

    // Faint track draws clockwise from the top; each node dot pops as the track passes it.
    draw(el("track"), 2.7, 0.9);
    [1, 2, 3, 4].forEach((n, i) =>
      tl.fromTo(
        el(`dot-${n}`),
        { attr: { r: 0 } },
        { attr: { r: 9 }, duration: 0.35, ease: "back.out(2)" },
        2.7 + i * 0.225,
      ),
    );
    light(1, 3.84); // "campaña"
    draw(el("arc-1"), 3.84, 1.2);

    // Scene 3 (4.4–5.8)
    light(2, 5.04); // "recordatorios"
    draw(el("arc-2"), 5.04, 1.36);

    // Scene 4 (5.8–9.19)
    light(3, 6.4); // "confirmar"
    draw(el("arc-3"), 7.4, 0.65); // ring closes through node 4 back to node 1 ("crea el nuevo ciclo")
    // short rise keeps the card's bottom (y≈880) inside the 900px keep-out while it slides in
    tl.fromTo(el("overlay"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 7.6);
    light(4, 7.8, 0.4, "back.out(2.2)"); // "nuevo" — pops positive
    tl.fromTo(
      el("ring-row"),
      { opacity: 0, scale: 1.03 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
      8.05,
    );
    tl.fromTo(
      el("hl"),
      { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out" },
      8.3,
    );

    window.__timelines = window.__timelines || {};
    window.__timelines["f10-renovaciones"] = tl;
  </script>
