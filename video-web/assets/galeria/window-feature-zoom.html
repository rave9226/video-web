  <script>
    (function () {
      var el = function (key) { return document.getElementById("f04-leads-" + key); };

      // ── Capture geometry: packet rects are in the 2880×1800 image's own pixels ──
      var IMG_W = 2880, IMG_H = 1800, VIEW_W = 1120, VIEW_H = 700;
      var S = VIEW_W / IMG_W; // display px per capture px (7/18)
      var place = function (node, r, pad) {
        node.style.left = (r[0] - pad) * S + "px";
        node.style.top = (r[1] - pad) * S + "px";
        node.style.width = (r[2] + 2 * pad) * S + "px";
        node.style.height = (r[3] + 2 * pad) * S + "px";
      };
      var SELECT_RECT = [818, 1016, 606, 124]; // "Canal de origen" select, app-leads-nuevo.png
      var TABS_ROW = [1392, 272, 1104, 68];
      var TABS = [
        [1540, 272, 164, 68], // Captura
        [1716, 272, 216, 68], // Elegibilidad
        [1944, 272, 202, 68], // Cotización
        [2158, 272, 132, 68] // Cierre
      ];
      var PILL_PAD = 6;
      var ring = el("ring");
      var pill = el("pill");
      var spot = el("spot");
      place(ring, SELECT_RECT, 8);
      place(pill, TABS[0], PILL_PAD);
      place(spot, TABS_ROW, 14);
      var pillAt = TABS.map(function (r) {
        return { x: (r[0] - TABS[0][0]) * S, width: (r[2] + 2 * PILL_PAD) * S };
      });

      // Punch-in on the stage tabs (nested wrappers → counter-translate T = -offset).
      // Gentle 1.5× (orchestrator review): the Leads page holds a single lead, so a 2.4×
      // push on the tabs alone left the window almost empty with clipped glyphs. At 1.5× the
      // view keeps title, tabs, filter and the lead card while the tabs still read clearly (view spans capture x 590–2510).
      var ZOOM = 1.5;
      var halfW = VIEW_W / (S * ZOOM) / 2;
      var halfH = VIEW_H / (S * ZOOM) / 2;
      var clamp = function (v, lo, hi) { return Math.min(Math.max(v, lo), hi); };
      // Focus = the whole tabs row (equal margins; its left edge lands past the lead card's
      // text, so no stray glyphs). y is clamped so the capture's top edge never enters the view.
      // Focus between the tabs row and the lead card (capture px), clamped to the image.
      var focusX = clamp(1550, halfW, IMG_W - halfW);
      var focusY = clamp(560, halfH, IMG_H - halfH);
      var camX = -(focusX * S - VIEW_W / 2);
      var camY = -(focusY * S - VIEW_H / 2);

      // VO word starts (s): lead-in 0.04–0.08 s so each reveal reads ON the word.
      var WORD_T = [0.0, 0.34, 0.64, 0.98, 1.12]; // Todo · empieza · con · un · lead
      var CHIP_T = [2.22, 2.98, 3.68, 4.54]; // formulario · chatbot · referido · carga de archivos
      var STAGE_T = [7.3, 8.16, 9.18, 10.34]; // captura · elegibilidad · cotización · cierre

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.5): window slides in from the right and settles; eyebrow + per-word h2
      tl.fromTo(el("win"), { x: 180 }, { x: 0, duration: 1.1, ease: "power3.out" }, 0);
      tl.fromTo(el("win"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);
      tl.fromTo(el("accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(el("eyebrow-text"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      WORD_T.forEach(function (t, i) {
        tl.fromTo(el("w" + i), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, Math.max(0, t - 0.04));
      });

      // Scene 2 (1.5–5.6): channel chips stack in on their words; in-window swap to the
      // Nuevo lead modal on "formulario" + turquoise focus ring on "Canal de origen"
      CHIP_T.forEach(function (t, i) {
        tl.fromTo(el("chip" + i), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, t - 0.04);
      });
      tl.fromTo(el("nuevo"), { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.inOut" }, 2.18);
      tl.fromTo(ring, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 2.42);

      // Scene 3 (5.6–11.59): swap back (the list fades in OVER the modal — no exit tween),
      // chips drop to 40%, punch-in on the tabs, pill + funnel step together, then hold.
      tl.fromTo(el("shot-b"), { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.inOut" }, 5.74);
      tl.fromTo(el("chips"), { opacity: 1 }, { opacity: 0.4, duration: 0.5, ease: "power2.out", immediateRender: false }, 5.74);
      tl.fromTo(el("zoom-outer"), { scale: 1 }, { scale: ZOOM, duration: 1.1, ease: "power3.inOut" }, 6.0);
      tl.fromTo(el("zoom-inner"), { x: 0, y: 0 }, { x: camX, y: camY, duration: 1.1, ease: "power3.inOut" }, 6.0);
      tl.fromTo(spot, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 6.5);

      tl.fromTo(pill, { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, STAGE_T[0] - 0.04);
      for (var i = 1; i < STAGE_T.length; i++) {
        tl.fromTo(
          pill,
          { x: pillAt[i - 1].x, width: pillAt[i - 1].width },
          { x: pillAt[i].x, width: pillAt[i].width, duration: 0.5, ease: "power3.out", immediateRender: false },
          STAGE_T[i] - 0.08
        );
      }
      STAGE_T.forEach(function (t, i) {
        tl.fromTo(
          el("bar" + i),
          { clipPath: "inset(0% 50% 0% 50% round 10px)", y: 10 },
          { clipPath: "inset(0% 0% 0% 0% round 10px)", y: 0, duration: 0.6, ease: "power3.out" },
          t - 0.06
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["f04-leads"] = tl;
    })();
