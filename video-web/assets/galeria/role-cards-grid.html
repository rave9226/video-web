      var cambio = byId("cambio");
      var chipSec = byId("chip-sec");

        var t = LAND[k];
        tl.fromTo(c, { y: 90 }, { y: 0, duration: 0.8, ease: "back.out(1.3)" }, t);
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, t);
        tl.fromTo(labels[k], { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, t + 0.12);
      });

      // Scene 3 (6.9–9.6) — "cada uno con su menú" @8.4: a turquoise bar steps down each

      var S = 220 / 255;

        for (var i = 1; i < MENU_ITEMS[k]; i++) {
          tl.to(b, { y: itemY(i), duration: 0.05, ease: "power2.out" }, t0 + 0.12 + (i - 1) * 0.07);

      // "sus permisos" @9.1 — second chip joins, first chip slides left to make room
      tl.to(chipCount, { x: 0, duration: 0.5, ease: "power3.inOut" }, 9.1);

      tl.fromTo(cambio, { x: 90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 10.3);
