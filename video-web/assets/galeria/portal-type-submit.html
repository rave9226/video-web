  <script>
    (() => {
      const $ = (name) => document.getElementById("f13-portal-" + name);
      const tl = gsap.timeline({ paused: true });
      const DUR = 7.59;

      // Card geometry (px inside #f13-portal-cam, capture shown at 0.6)
      const FX = 306; // input centre x
      const FY = 354; // input centre y
      const Z = 1.3; // push-in onto the input (0.78 of the 2x capture, never upscaled)
      const GROW = 247.2; // answer block height (412 capture rows)
      const KF = 0.95; // settled scale once the answer is in, keeps the card inside y 50–830
      const REST_TOP = 153.2; // cam top; card centre 440 at rest
      const CENTER_Y = 440;
      const EXPANDED_H = 820.8;

      // Scene 1 (0.0–2.9): slide header, query card rises centre-right
      tl.fromTo($("rule"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);
      tl.fromTo($("eyebrow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
      Array.from($("title").getElementsByClassName("f13-portal-word")).forEach((word, i) => {
        tl.fromTo(word, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.42 + i * 0.16);
      });
      tl.fromTo($("card"), { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.3);

      // Scene 2 (2.9–4.9): coordinate-target push-in (input centre stays put), focus, typing, press
      tl.fromTo(
        $("cam"),
        { x: 0, y: 0, scale: 1 },
        { x: -(Z - 1) * FX, y: -(Z - 1) * FY, scale: Z, duration: 0.5, ease: "power3.inOut" },
        2.9,
      );
      // white focus fill covers the placeholder before the first keystroke
      tl.fromTo($("field"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, 3.0);

      // discrete-text-sequence (plain keystrokes) + caret, as pure functions of timeline time
      const DIGITS = "8645479";
      const KEYS = [3.4, 3.51, 3.63, 3.74, 3.87, 3.99, 4.12];
      const CARET_ON = 3.15;
      const CARET_OFF = 4.4;
      const digitsEl = $("digits");
      const caretEl = $("caret");
      const driver = { t: 0 };
      const paint = () => {
        const t = driver.t;
        let n = 0;
        while (n < KEYS.length && t >= KEYS[n]) n++;
        digitsEl.textContent = DIGITS.slice(0, n);
        // solid for 0.4 s after focus / each keystroke, then a 0.7 s square-wave blink
        const since = t - Math.max(CARET_ON, n > 0 ? KEYS[n - 1] : CARET_ON);
        const on = t >= CARET_ON && t < CARET_OFF && since % 0.7 < 0.4;
        caretEl.style.opacity = on ? "1" : "0";
      };
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: paint }, 0);
      paint();

      // press-release-spring (subtle): linear dip, soft release, ink ripple clipped to the button
      tl.fromTo($("btn"), { scale: 1 }, { scale: 0.96, duration: 0.1, ease: "power1.in" }, 4.4);
      tl.to($("btn"), { scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 4.5);
      tl.fromTo($("tint"), { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "power1.in" }, 4.4);
      tl.to($("tint"), { opacity: 0, duration: 0.4, ease: "power2.out" }, 4.5);
      tl.fromTo($("ripple"), { scale: 0.08 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 4.42);
      tl.fromTo($("ripple"), { opacity: 0 }, { opacity: 0.35, duration: 0.08, ease: "none" }, 4.42);
      tl.to($("ripple"), { opacity: 0, duration: 0.5, ease: "power2.in" }, 4.5);
      // focus leaves the input on submit: the field settles back to its resting fill, digits stay
      tl.to($("focus"), { opacity: 0, duration: 0.3, ease: "power2.out" }, 4.45);

      // Scene 3 (4.9–7.59): the answer arrives in place. One proxy drives both sides of the
      // seam (answer block clip + footer push) so they never separate; the camera pulls back
      // on the same curve and re-centres the grown card.
      const sheetEl = $("sheet");
      const belowEl = $("below");
      const grow = { p: 0 };
      const layout = () => {
        const hidden = GROW * (1 - grow.p);
        sheetEl.style.clipPath = "inset(0px 0px " + hidden + "px 0px)";
        gsap.set(belowEl, { y: -hidden });
      };
      tl.fromTo(grow, { p: 0 }, { p: 1, duration: 0.8, ease: "power3.inOut", onUpdate: layout }, 4.9);
      layout();
      tl.to(
        $("cam"),
        { x: (1 - KF) * FX, y: CENTER_Y - REST_TOP - (KF * EXPANDED_H) / 2, scale: KF, duration: 0.8, ease: "power3.inOut" },
        4.9,
      );

      tl.fromTo($("chip"), { scale: 0, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["f13-portal"] = tl;
    })();
  </script>
