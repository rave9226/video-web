      // to whole pixels, which also made the reverted state depend on seek order.
      var tl = gsap.timeline({ paused: true, defaults: { autoRound: false } });

      // ---- Scene 1 (0-3.3s): atmosphere, per-word h1 on the voice, turquoise underline.
      tl.fromTo(byClass("dot"), { opacity: 0, scale: 0.3 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.035 }, 0.1);
      // voiceover word starts: Una afiliación de salud visual / tiene muchos pasos .
      var WORD_T = [0.62, 1.2, 1.8, 1.86, 2.04, 2.4, 2.68, 3.04, 3.04];
      byClass("w").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, WORD_T[i] - 0.08);
      });
      var uline = byId("uline-path");
      prepDraw(uline, 1, 8);
      tl.to(uline, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 2.72);

      // ---- Scene 2 (3.3-12.3s): headline shrinks to a top-left eyebrow (left edges land on x=96;
      // 0.34 keeps it at the 1.4cqw legibility floor).
      var EYEBROW_S = 0.34;
      var EYEBROW_TOP = 72;
      var L1_TOP = parseFloat(l1.style.top);
      var L2_TOP = parseFloat(l2.style.top);
      var LINE_H = 80.64 * 1.08;
      tl.to(l1, { xPercent: 50, x: 96 - 960, y: EYEBROW_TOP - L1_TOP, scale: EYEBROW_S,
        duration: 0.6, ease: "power3.inOut" }, 3.35);
      tl.to(l2, { xPercent: 50, x: 96 - 960, y: EYEBROW_TOP + EYEBROW_S * LINE_H - L2_TOP,
        scale: EYEBROW_S, duration: 0.6, ease: "power3.inOut" }, 3.35);

      // Station reveals on their words: ring draws from 9 o'clock (where the path lands),
      // icon strokes draw inside it, label rises.
      var ST_T = [3.7, 5.0, 6.2, 7.1, 8.0, 9.2, 11.6];
      stations.forEach(function (st, k) {
        var t = ST_T[k];
        var ring = byClass("ring", st)[0];
        var ico = byClass("ico", st)[0];
        prepDraw(ring, 1.02, 1);
        tl.to(ring, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, t);
        tl.fromTo(byClass("disc", st)[0], { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power1.out" }, t);
        tl.fromTo(ico, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, t + 0.08);
        Array.prototype.slice.call(ico.querySelectorAll("path, circle, rect")).forEach(function (el, j) {
          prepDraw(el, 1.05, 2);
          tl.to(el, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t + 0.08 + j * 0.06);
        });
        tl.fromTo(byClass("lbl", st)[0], { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.12);
      });

      // Camera legs into stations 2-6 (ease-in-out), each path segment drawing under the camera
      // and landing on the next ring as it reveals.
      var LEG_T = [4.5, 5.7, 6.6, 7.5, 8.7];
      LEG_T.forEach(function (t0, i) {
        tl.to(world, Object.assign(camOn(pos[i + 1]), { duration: 0.55, ease: "power2.inOut" }), t0);
        tl.to(segs[i], { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, t0);
      });

      // Activación -> Renovación: "+1 año" rides the drawing tip to the segment midpoint
      // (camera follows), then the path finishes into Renovación.
      var seg6 = segs[5];
      var half = segLen[5] / 2;
      var N = 24;
      var XS = [];
      var YS = [];
      for (var i = 0; i <= N; i++) {
        var pt = seg6.getPointAtLength(half * (i / N));
        XS.push(pt.x);
        YS.push(pt.y);
      }
      var tag = byId("tag");
      gsap.set(tag, { x: XS[0], y: YS[0] });
      tl.fromTo(byId("tag-pill"), { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 10.2);
      tl.to(tag, { keyframes: { x: XS, y: YS, easeEach: "none" }, duration: 0.7, ease: "power2.inOut" }, 10.2);
      tl.to(seg6, { strokeDashoffset: half, duration: 0.7, ease: "power2.inOut" }, 10.2);
      tl.to(world, Object.assign(camOn({ x: XS[N], y: YS[N] }), { duration: 0.7, ease: "power2.inOut" }), 10.2);
      tl.to(seg6, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 11.05);
      tl.to(world, Object.assign(camOn(pos[6]), { duration: 0.6, ease: "power2.inOut" }), 11.05);

      // ---- Scene 3 (12.3-16.2s): one decelerating pull-back to the whole journey
      // (strokes thicken so they keep ~2px on screen at 1x).
      tl.to(world, { x: 0, y: 0, scale: 1, duration: 1.7, ease: "expo.out", force3D: false }, 12.7);
      tl.to(segs, { strokeWidth: 2, duration: 1.7, ease: "expo.out" }, 12.7);
      tl.to(byClass("ring"), { strokeWidth: 2, duration: 1.7, ease: "expo.out" }, 12.7);

      // "en un solo lugar": one shared tween drives every station to the centre in lockstep;
      // rings grow to the isotipo's footprint while labels, icons, path and eyebrow clear.
      tl.to(stations, {
        x: function (k) { return CX - pos[k].x; },
        y: function (k) { return CY - pos[k].y; },
        duration: 0.5,
        ease: "power3.inOut",
      }, 14.9);
      tl.to(nodes, { scale: 5, duration: 0.5, ease: "power3.inOut" }, 14.9);
      tl.to(byClass("lbl").concat(byClass("ico"), byClass("disc")),
        { opacity: 0, duration: 0.22, ease: "power1.in" }, 14.9);
      tl.to(byId("rail"), { scale: 0.02, duration: 0.5, ease: "power3.inOut" }, 14.9);
      tl.to(byId("rail"), { opacity: 0, duration: 0.3, ease: "none" }, 14.9);
      tl.to([l1, l2], { opacity: 0, duration: 0.4, ease: "power1.in" }, 14.9);

      // scale-swap-transition: merged ring rushes out, white B isotipo pops in at 15.6.
      tl.to(nodes, { scale: 3.5, opacity: 0, duration: 0.3, ease: "power2.in" }, 15.45);
      tl.fromTo(byId("logo-pop"), { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.8)" }, 15.6);

      // ---- Scene 4 (16.2-19.75s): isotipo slides left while the wordmark wipes in; h2 per word;
      // B2C · B2B pill settles; hold.
      tl.fromTo(byId("logo-move"), { x: LOGO_B_OFFSET_X },
        { x: 0, duration: 0.95, ease: "power3.inOut" }, 16.35);
      tl.fromTo(byId("logo-img"), { clipPath: "inset(0% 67.5% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.95, ease: "power2.inOut" }, 16.45);
      var H2_T = [16.4, 17.12, 17.5];
      byClass("h2w").forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, H2_T[i]);
      });
      tl.fromTo(byId("pill"), { opacity: 0, y: 18, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 18.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["f01-hook"] = tl;
    })();
  </script>
</template>
